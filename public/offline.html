<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#171615" />
<title>Offline · farmOS</title>
<link rel="icon" href="/icon.svg" />
<style>
  :root { color-scheme: light dark; --bg:#fbfaf7; --ink:#1f1d1a; --muted:#77716a; --line:#e7e3dc; --accent:#b8572b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#171615; --ink:#ece9e4; --muted:#9a948c; --line:#2b2926; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; padding:24px; }
  .card { max-width: 360px; text-align:center; }
  img { width:44px; height:44px; border-radius:10px; }
  h1 { font: 500 26px/1.2 Georgia, "EB Garamond", serif; margin:16px 0 6px; }
  p { color:var(--muted); margin:0 0 18px; }
  button { font:inherit; font-size:13px; height:32px; padding:0 14px; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; }
  button:hover { border-color: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <img src="/icon.svg" alt="" />
    <h1>You're offline</h1>
    <p>farmOS keeps your data on the server, so it needs a connection. Your work is safe.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
